version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a new release age before it is proposed; security updates are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      # inspect-ai is pinned exactly and the contract tests exist to vet each bump, so it
      # stays out of the groups and always gets a pull request of its own.
      dev-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production
        exclude-patterns: ["inspect-ai"]
