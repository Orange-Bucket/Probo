[project]
name = "probo"
version = "0.1.0"
description = "Firing range and proof harness for attacks on AI agents, built on Inspect"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "inspect-ai==0.3.289",
    "pydantic>=2.13",
]

[project.optional-dependencies]
# Inspect talks to Ollama through its OpenAI-compatible API and needs this client for it.
ollama = [
    "openai>=2",
]

[project.scripts]
probo = "probo.cli:main"

[project.entry-points.inspect_ai]
probo = "probo._registry"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probo"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]
