# Non-root default user plus plain Compose resource limits.
services:
  default:
    image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    command: tail -f /dev/null
    init: true
    network_mode: none
    user: "1000:1000"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
