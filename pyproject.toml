# uv workspace root. It is not a package: the Python package lives in packages/probo.
# Tool settings here apply to the whole repository, so the same configuration is used
# whether a tool runs from the root or through an Nx target.

[tool.uv.workspace]
members = ["packages/*"]

# A plain `uv sync` installs this group, which installs probo from the workspace as well.
[dependency-groups]
dev = [
    "probo",
    "openai>=2",
    "mcp>=2.3,<3",
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.uv.sources]
probo = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/probo/tests"]
addopts = "--strict-markers"
markers = [
    "docker: needs a running Docker daemon",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Where first-party imports live, so import sorting treats probo as first-party.
src = ["packages/probo/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["packages/probo/src", "packages/probo/tests"]
# Resolve probo as local source, not as the installed library.
extraPaths = ["packages/probo/src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
