[project]
name = "probo"
version = "0.0.0"
description = "Firing range and proof harness for attacks on AI agents, built on Inspect"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "inspect-ai==0.3.289",
    "pydantic>=2.13",
]

[project.scripts]
probo = "probo.cli:main"

[project.entry-points.inspect_ai]
probo = "probo._registry"

[dependency-groups]
dev = [
    "mcp>=2.3,<3",
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probo"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "docker: needs a running Docker daemon",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
