# Offline sandbox with a stdlib-only MCP stdio server mounted read-only.
services:
  default:
    image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    command: tail -f /dev/null
    init: true
    network_mode: none
    volumes:
      - ../mcp_servers/stdlib_server.py:/opt/probo/stdlib_server.py:ro
